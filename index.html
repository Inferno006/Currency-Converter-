<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter & Rate Analytics</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="header-top">
        <h1>Currency Converter</h1>
        <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Theme">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
      <p>Real-time exchange rates, market trends & conversion history</p>
    </header>

    <main class="grid-layout">
      <!-- Left Column: Converter & Recent Conversions -->
      <div class="left-column">
        <section class="card converter-card">
          <h2>Convert Currency</h2>
          
          <div id="errorMessage" class="error-banner hidden"></div>

          <div class="input-group">
            <label for="amount">Amount</label>
            <div class="input-wrapper">
              <span id="amountPrefix" class="prefix">$</span>
              <input type="number" id="amount" value="100" min="0.01" step="any">
            </div>
          </div>

          <div class="currency-selectors">
            <div class="select-group">
              <label for="fromCurrency">From</label>
              <select id="fromCurrency">
                <option value="USD" selected>USD - US Dollar</option>
                <option value="EUR">EUR - Euro</option>
                <option value="INR">INR - Indian Rupee</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="JPY">JPY - Japanese Yen</option>
                <option value="AUD">AUD - Australian Dollar</option>
                <option value="CAD">CAD - Canadian Dollar</option>
                <option value="CHF">CHF - Swiss Franc</option>
              </select>
            </div>

            <button id="swapBtn" class="icon-btn" title="Swap Currencies">⇄</button>

            <div class="select-group">
              <label for="toCurrency">To</label>
              <select id="toCurrency">
                <option value="USD">USD - US Dollar</option>
                <option value="EUR" selected>EUR - Euro</option>
                <option value="INR">INR - Indian Rupee</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="JPY">JPY - Japanese Yen</option>
                <option value="AUD">AUD - Australian Dollar</option>
                <option value="CAD">CAD - Canadian Dollar</option>
                <option value="CHF">CHF - Swiss Franc</option>
              </select>
            </div>
          </div>

          <button id="convertBtn" class="primary-btn">Convert</button>

          <div class="result-display">
            <span id="resultText" class="result-text">--</span>
            <span id="lastUpdated" class="timestamp">Last updated: --</span>
          </div>
        </section>

        <!-- Recent Conversions Card (Moved below converter) -->
        <section class="card history-card">
          <div class="history-header">
            <h2>Recent Conversions</h2>
            <button id="clearHistoryBtn" class="clear-btn">Clear</button>
          </div>
          <ul id="historyList" class="history-list"></ul>
        </section>
      </div>

      <!-- Right Column: Exchange Rate Analytics -->
      <div class="right-column">
        <section class="card chart-card">
          <div class="chart-header">
            <div>
              <h2>Exchange Rate Analytics</h2>
              <span id="chartLabel" class="chart-subtitle">7-Day Trend</span>
            </div>
            <div class="timeframe-selector" id="timeframeSelector">
              <button class="timeframe-btn active" data-tf="7D">7D</button>
              <button class="timeframe-btn" data-tf="30D">30D</button>
              <button class="timeframe-btn" data-tf="6M">6M</button>
              <button class="timeframe-btn" data-tf="1Y">1Y</button>
              <button class="timeframe-btn" data-tf="10Y">10Y</button>
            </div>
          </div>

          <div class="chart-wrapper">
            <canvas id="rateChart"></canvas>
          </div>

          <!-- Summary Statistics Grid -->
          <div class="chart-stats" id="chartStats">
            <div class="stat-box">
              <span class="stat-label">High</span>
              <span class="stat-value" id="statHigh">--</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Low</span>
              <span class="stat-value" id="statLow">--</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Average</span>
              <span class="stat-value" id="statAvg">--</span>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
